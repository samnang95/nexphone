name: nexphone_app
description: "NexPhone mobile app"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter

  # State Management (BLoC Pattern)
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # Networking & HTTP
  dio: ^5.7.0

  # Dependency Injection & Service Locator
  get_it: ^9.3.0

  # Value Equality
  equatable: ^3.0.0

  # Local & Secure Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.5

  # Design & Icons
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  go_router: ^18.1.0
  firebase_core: ^4.15.0
  flutter_localization: ^0.4.1
  flutter_localizations:
    sdk: flutter
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # BLoC & Architecture Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.prod
    - assets/icons/
    - assets/images/
    - assets/images/banners/
    - assets/images/products/
    - assets/languages/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/Noto_Sans/static/NotoSans-Regular.ttf
        - asset: assets/fonts/Noto_Sans/static/NotoSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/Noto_Sans/static/NotoSans-Light.ttf
          weight: 300
        - asset: assets/fonts/Noto_Sans/static/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Noto_Sans/static/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Noto_Sans/static/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Noto_Sans/static/NotoSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Noto_Sans/static/NotoSans-Black.ttf
          weight: 900
        - asset: assets/fonts/Noto_Sans/static/NotoSans-Italic.ttf
          style: italic
        - asset: assets/fonts/Noto_Sans/static/NotoSans-BoldItalic.ttf
          weight: 700
          style: italic

    - family: Hanuman
      fonts:
        - asset: assets/fonts/Hanuman/static/Hanuman-Regular.ttf
        - asset: assets/fonts/Hanuman/static/Hanuman-Thin.ttf
          weight: 100
        - asset: assets/fonts/Hanuman/static/Hanuman-Light.ttf
          weight: 300
        - asset: assets/fonts/Hanuman/static/Hanuman-Medium.ttf
          weight: 500
        - asset: assets/fonts/Hanuman/static/Hanuman-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Hanuman/static/Hanuman-Bold.ttf
          weight: 700
        - asset: assets/fonts/Hanuman/static/Hanuman-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Hanuman/static/Hanuman-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
